name: CI

# Phase 0 (hygiene): gate every push / PR on the test suite + ruff so regressions and
# dead code can't land silently. See handoff.md §3 for the local baseline.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    env:
      # Keep the run hermetic: no real Postgres/S3, container/in-process tools off.
      GIMS_RDS_ENABLED: "0"
      GIMS_STORAGE_PROVIDER: "local"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boot check (app imports + route count)
        run: python -c "import api.app as m; print('routes:', len(m.app.openapi()['paths']))"
      - name: Run test suite
        # The 6 deselected tests are pre-existing, environment/isolation-dependent
        # (real S3/Postgres infra, a known test-isolation seam leak, and CLI-era stubs) —
        # not regressions. Everything else must stay green. See handoff.md §3.
        run: |
          python -m pytest -q -p no:cacheprovider \
            --deselect "tests/cli_tests/test_adjective_classes.py::test_show_request_status_invokes_check_and_evaluate" \
            --deselect "tests/gui_tests/test_archive_workbench_gui.py::test_list_projects_and_verb_groups" \
            --deselect "tests/gui_tests/test_archive_workbench_gui.py::test_s3_projects_and_run_archive_restore" \
            --deselect "tests/gui_tests/test_archive_workbench_gui.py::test_rds_mode_runs_archive_restore_smoke" \
            --deselect "tests/gui_tests/test_run_customs_gui.py::test_check_parser_projects_listing" \
            --deselect "tests/gui_tests/test_run_customs_gui.py::test_list_available_pphrases"

  lint:
    name: ruff (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: ruff check (config in pyproject.toml)
        run: ruff check api core nodes utils modules
