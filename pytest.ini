[pytest]
# Only collect the real test suite. This deliberately excludes non-test files that
# match test_*.py elsewhere in the tree (e.g. gui/test_page_gui.py is a GUI module,
# root test_upload.py is a stub, tools/*_test.py are scratch) so the suite stays clean
# without deleting anything.
testpaths = tests

# Two legacy CLI tests don't import in this environment and are quarantined here with
# a reason (Phase 0 — they protect surfaces slated for later work, not regressions now):
#   - test_view.py    imports tools.view.load_items, which no longer exists.
#   - test_webapp.py  imports the Flask camera micro-app (flask is not installed; that
#                     subsystem is dormant and separate from the FastAPI app).
addopts = -q -p no:cacheprovider --ignore=tests/cli_tests/test_view.py --ignore=tests/cli_tests/test_webapp.py

markers =
    concurrency: exercises concurrent / locking behavior (e.g. the R1 duplicate-ID race)
    security: security / authz regression tests (e.g. the R6 forge-your-own-roles bypass)
    integration: boots the app or touches the DB / filesystem
