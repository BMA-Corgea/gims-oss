<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conjunction Editor</title>
  <link rel="stylesheet" href="/static/styles/conjunction.css">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
</head>
<body>

<div class="conjunction-manager">
  <div class="section-header">
    <h2>Conjunction Editor</h2>
    <div class="project-selector">
      <label for="project-select">Project:</label>
      <select id="project-select">
        <option value="">Select a project</option>
      </select>
    </div>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div class="verb-selector">
        <h3>Verbs</h3>
        <select id="verb-select" size="10">
          <option value="">Select a project first</option>
        </select>
      </div>
    </div>

    <div class="right-panel">
      <div class="conjunction-list-container">
        <div class="panel-header">
          <h3>Conjunctions</h3>
          <button id="add-conjunction-btn" class="action-button" disabled>Add New</button>
        </div>
        <div class="conjunction-list">
          <table id="conjunction-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="conjunction-list-body">
              <tr>
                <td colspan="3">Select a verb to view conjunctions</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="conjunction-form-container" class="hidden">
        <div class="panel-header">
          <h3 id="form-title">New Conjunction</h3>
          <button id="close-form-btn" class="action-button">Close</button>
        </div>
        <form id="conjunction-form">
          <input type="hidden" id="edit-mode" value="new">
          <input type="hidden" id="original-name" value="">
          
          <div class="form-group">
            <label for="conj-name">Name:</label>
            <input type="text" id="conj-name" required>
          </div>
          
          <div class="form-group">
            <label for="conj-description">Description:</label>
            <textarea id="conj-description" rows="2"></textarea>
          </div>
          
          <div class="form-group">
            <label for="conj-category">Category:</label>
            <select id="conj-category">
              <option value="Error">Error</option>
              <option value="Exception">Exception</option>
              <option value="Cancelled">Cancelled</option>
              <option value="Notification">Notification</option>
            </select>
          </div>
          
          <div class="form-group">
            <h4>Fields</h4>
            <button type="button" id="add-field-btn" class="secondary-button">Add Field</button>
            <div id="fields-container"></div>
          </div>
          
          <div class="form-actions">
            <button type="submit" id="save-conjunction-btn" class="primary-button">Save</button>
            <button type="button" id="cancel-btn" class="secondary-button">Cancel</button>
          </div>
        </form>
      </div>
      
      <div id="apply-conjunction-container" class="hidden">
        <div class="panel-header">
          <h3>Apply Conjunction</h3>
          <button id="close-apply-btn" class="action-button">Close</button>
        </div>
        <form id="apply-conjunction-form">
          <div class="form-group">
            <label for="verb-group-select">Verb Group:</label>
            <select id="verb-group-select" required></select>
          </div>
          
          <div class="form-group">
            <label for="run-id-select">Run ID:</label>
            <select id="run-id-select" required></select>
          </div>
          
          <div id="override-fields-container"></div>
          
          <div class="form-actions">
            <button type="submit" id="apply-btn" class="primary-button">Apply</button>
            <button type="button" id="cancel-apply-btn" class="secondary-button">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="/static/scripts/conjunction.js"></script>
</body>
</html>
