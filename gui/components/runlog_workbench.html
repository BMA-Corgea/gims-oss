<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Runlog Workbench</title>

  <!-- Local styles -->
  <link rel="stylesheet" href="/static/styles/runlog_workbench.css" />

  <!-- Glide Data Grid styles -->
  <link
    rel="stylesheet"
    href="https://esm.sh/@glideapps/glide-data-grid@6/dist/index.css"
  />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">

  <!-- 🔑 IMPORT MAP: fixes bare module specifiers -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19?dev",
      "react-dom": "https://esm.sh/react-dom@19?dev",
      "react-dom/client": "https://esm.sh/react-dom@19/client?dev",
      "@glideapps/glide-data-grid": "https://esm.sh/@glideapps/glide-data-grid@6"
    }
  }
  </script>
</head>

<body>
  <div class="container">
    <header>
      <h1>Runlog Workbench</h1>
      <div class="controls">
        <div class="control-group">
          <label for="project-select">Project</label>
          <select id="project-select"></select>
        </div>
        <div class="control-group">
          <label for="verbgroup-select">Verb Group</label>
          <select id="verbgroup-select" disabled></select>
        </div>
      </div>
    </header>

    <main>
      <section id="runlog-section">
        <h2>Run Log</h2>
        <div class="table-container">
          <table id="runlog-table" class="data-table"></table>
        </div>
      </section>

      <section id="data-dump-section" class="hidden">
        <div class="section-header">
          <h2>Data Dump</h2>
          <button id="close-dump" class="close-button">&times;</button>
        </div>
        <div id="data-dump-tabs" class="tabs"></div>
        <div id="data-dump-contents"></div>
      </section>
    </main>

    <footer>
      <div class="status-bar" id="status-bar">Ready.</div>
    </footer>
  </div>

  <!-- Required by Glide Data Grid portals -->
  <div id="portal"></div>

  <!-- 🚀 Your JS must be a module -->
  <script
    type="module"
    src="/static/scripts/runlog_workbench.js?v=20250806193822">
  </script>
</body>
</html>
