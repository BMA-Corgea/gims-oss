<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIMS Image Capture</title>
  <link rel="stylesheet" href="/static/styles/camera.css">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
</head>
<body>
  <header>
    <div class="header-container">
      <h1>📸 GIMS Image Capture</h1>
      <div id="context-info">
        <div id="project-info">Loading project info...</div>
      </div>
    </div>
  </header>

  <main>
    <div class="control-panel">
      <div class="selection-controls">
        <div class="control-group">
          <label for="nounSelect">Entity Type:</label>
          <select id="nounSelect" class="input-field">
            <option disabled selected>Loading...</option>
          </select>
        </div>
        
        <div class="control-group">
          <label for="itemSelect">Select Item:</label>
          <select id="itemSelect" class="input-field">
            <option disabled selected>Select a noun first</option>
          </select>
        </div>
        
        <div class="button-group">
          <button id="toggleModeBtn" class="secondary-button">
            <span class="icon">🎥</span> Switch to Webcam
          </button>
        </div>
      </div>

      <div class="capture-area">
        <div id="fileUploadSection" class="capture-section active">
          <div class="file-drop-area">
            <span class="file-msg">Drag & drop image or click to browse</span>
            <input type="file" accept="image/*" id="fileInput" class="file-input">
          </div>
        </div>

        <div id="webcamSection" class="capture-section">
          <video id="video" autoplay playsinline></video>
          <button id="snapBtn" class="primary-button">
            <span class="icon">📸</span> Capture Photo
          </button>
        </div>

        <div id="previewSection" class="capture-section">
          <div class="preview-container">
            <img id="preview" alt="Preview">
            <button id="retakeBtn" class="secondary-button">
              <span class="icon">🔄</span> Retake
            </button>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button id="uploadBtn" class="primary-button" disabled>
          <span class="icon">📤</span> Upload Image
        </button>
      </div>
    </div>
  </main>

  <div id="status-bar">
    <div id="status-message"></div>
    <div id="progress-bar"><div id="progress-inner"></div></div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>
  
  <script src="/static/scripts/camera.js"></script>
</body>
</html>
