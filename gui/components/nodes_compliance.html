<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nodes — Audit & Compliance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/styles/nodes_compliance.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="app-title">GIMS</span>
      <span class="sep">•</span>
      <span class="page-title">Nodes — Audit & Compliance</span>
    </div>

    <div class="project-picker">
      <label for="projectSelect">Project</label>
      <select id="projectSelect" class="select"></select>
      <button id="refreshAll" class="btn btn-outline" title="Refresh both tabs">Refresh</button>
    </div>
  </header>

  <main class="page">
    <!-- File Watcher Panel -->
    <section id="panel-filewatcher" class="filewatcher-panel">
      <div class="fw-header">
        <h2>File Watcher</h2>
        <div class="fw-status-group">
          <div class="fw-status-item">
            <span class="fw-label">System:</span>
            <span id="fw-system-status" class="fw-indicator" title="watchfiles library available"></span>
          </div>
          <div class="fw-status-item">
            <span class="fw-label">Auth:</span>
            <span id="fw-auth-status" class="fw-indicator" title="Authentication token present"></span>
          </div>
          <div class="fw-status-item">
            <span class="fw-label">API:</span>
            <span id="fw-api-status" class="fw-indicator" title="Can reach compliance API"></span>
          </div>
        </div>
        <button id="fw-health-check" class="btn btn-outline">Check Health</button>
      </div>

      <div class="fw-add-folder">
        <input id="fw-new-folder" class="input" type="text" placeholder="Enter folder path (e.g., C:/NMR/Exports)" />
        <button id="fw-add-folder-btn" class="btn btn-primary">Add Folder</button>
      </div>

      <div id="fw-folders" class="fw-folders-list">
        <!-- Folder items will be inserted here -->
      </div>

      <div class="fw-controls">
        <button id="fw-start-all" class="btn btn-primary">Start All</button>
        <button id="fw-stop-all" class="btn">Stop All</button>
        <button id="fw-refresh" class="btn btn-outline">Refresh Status</button>
      </div>

      <div id="fw-recent-events" class="fw-recent-events">
        <h3>Recent Events</h3>
        <div id="fw-events-list" class="fw-events">
          <p class="fw-no-events">No events yet</p>
        </div>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab active" data-target="panel-compliance" id="tabCompliance">Compliance Log</button>
      <button class="tab" data-target="panel-audit" id="tabAudit">Audit Log</button>
    </nav>

    <!-- Compliance Panel -->
    <section id="panel-compliance" class="panel active">
      <div class="toolbar">
        <div class="inputs">
          <input id="comp-search" class="input" type="search" placeholder="Search text columns…" />
          <label>From <input id="comp-start" type="datetime-local" class="input dt"></label>
          <label>To <input id="comp-end" type="datetime-local" class="input dt"></label>

          <label>Order by
            <select id="comp-order-by" class="select"></select>
          </label>
          <button id="comp-order-dir" class="btn" title="Toggle sort direction">DESC</button>

          <label>Page size
            <select id="comp-limit" class="select">
              <option>50</option>
              <option selected>100</option>
              <option>200</option>
              <option>500</option>
              <option>1000</option>
            </select>
          </label>
        </div>

        <div class="filters">
          <input id="comp-actor" class="input" placeholder="actor=…" />
          <input id="comp-action" class="input" placeholder="action=…" />
          <input id="comp-node" class="input" placeholder="node=…" />
          <input id="comp-module" class="input" placeholder="module=…" />
        </div>

        <div class="actions">
          <button id="comp-apply" class="btn btn-primary">Apply</button>
          <button id="comp-reset" class="btn btn-outline">Reset</button>
          <button id="comp-export-csv" class="btn">Export CSV</button>
          <button id="comp-export-json" class="btn">Export JSON</button>
        </div>
      </div>

      <div class="statusbar">
        <div id="comp-status">Ready.</div>
        <div class="pager">
          <button id="comp-prev" class="btn">&larr; Prev</button>
          <button id="comp-next" class="btn">Next &rarr;</button>
        </div>
      </div>

      <div id="comp-table" class="table-wrap"></div>
    </section>

    <!-- Audit Panel -->
    <section id="panel-audit" class="panel">
      <div class="toolbar">
        <div class="inputs">
          <input id="audit-search" class="input" type="search" placeholder="Search text columns…" />
          <label>From <input id="audit-start" type="datetime-local" class="input dt"></label>
          <label>To <input id="audit-end" type="datetime-local" class="input dt"></label>

          <label>Order by
            <select id="audit-order-by" class="select"></select>
          </label>
          <button id="audit-order-dir" class="btn" title="Toggle sort direction">DESC</button>

          <label>Page size
            <select id="audit-limit" class="select">
              <option>50</option>
              <option selected>100</option>
              <option>200</option>
              <option>500</option>
              <option>1000</option>
            </select>
          </label>
        </div>

        <div class="filters">
          <input id="audit-user" class="input" placeholder="user_id=…" />
          <input id="audit-run" class="input" placeholder="run_id=…" />
          <input id="audit-verb" class="input" placeholder="verb=…" />
        </div>

        <div class="actions">
          <button id="audit-apply" class="btn btn-primary">Apply</button>
          <button id="audit-reset" class="btn btn-outline">Reset</button>
          <button id="audit-export-csv" class="btn">Export CSV</button>
          <button id="audit-export-json" class="btn">Export JSON</button>
        </div>
      </div>

      <div class="statusbar">
        <div id="audit-status">Ready.</div>
        <div class="pager">
          <button id="audit-prev" class="btn">&larr; Prev</button>
          <button id="audit-next" class="btn">Next &rarr;</button>
        </div>
      </div>

      <div id="audit-table" class="table-wrap"></div>
    </section>

    <div id="errorBox" class="error" hidden></div>
    <div id="loadingOverlay" class="loading" hidden>
      <div class="spinner"></div>
      <div>Loading…</div>
    </div>
  </main>

  <script src="/static/scripts/nodes_compliance.js"></script>
</body>
</html>
