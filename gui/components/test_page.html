<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DataEntry – Runs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://esm.sh/@glideapps/glide-data-grid@6/dist/index.css">
  <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
  <style>
    :root { color-scheme: dark; }
    *{box-sizing:border-box}
    body{margin:0;background:#0f1216;color:#eaeff4;font:14px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    header,main{padding:12px}
    .bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
    label{display:flex;flex-direction:column;font-size:12px;opacity:.85}
    input,select,button{
      font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #263039;background:#131922;color:inherit
    }
    button{cursor:pointer}
    button:disabled{opacity:.5;cursor:default}
    .card{border:1px solid #263039;border-radius:12px;background:#0f131b;padding:12px;margin-top:10px}
    .muted{opacity:.75}
    main{display:grid;grid-template-columns:2fr 1fr;gap:12px}
    @media (max-width:1100px){ main{grid-template-columns:1fr} }
    #grid-host{height:70vh;min-height:320px}
    pre{margin:0;padding:10px;border-radius:8px;border:1px solid #263039;background:#0b0f15;overflow:auto}
  </style>
</head>
<body>
  <header class="card">
    <div class="bar">
      <label>Project <input id="project" value="LIMS-System"></label>
      <label>Verb group <input id="verb-group" value="Tests"></label>
      <label style="min-width:220px;flex:1">Run
        <select id="run"></select>
      </label>

      <button id="refresh-runs">Refresh runs</button>
      <button id="load">Load</button>
      <button id="save" disabled>Save</button>
      <span class="muted" style="margin-left:auto" id="status"></span>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="bar">
        <div class="muted">DataEntry.json</div>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button id="add-row">+ Row</button>
          <button id="gen-id" title="F2">Generate ID</button>
          <button id="copy-json">Copy JSON</button>
        </div>
      </div>
      <div id="grid-host"></div>
      <div class="muted" style="font-size:12px">
        Tips: click into the grid and type. Ctrl+S save • Ctrl+Z / Ctrl+Y undo/redo • F2 generate ID • F1 (primary) menu (when available).
      </div>
    </section>

    <section class="card">
      <div class="muted">Preview</div>
      <pre id="json-preview">{}</pre>
    </section>
  </main>

  <!-- 👇 required by Glide overlay editor (fixes “portal not found”) -->
  <div id="portal"></div>

  <script type="module" src="/static/scripts/test_page.js?v=20250806193822"></script>
</body>
</html>
