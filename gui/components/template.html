<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Project Template Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/static/styles/template.css" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <span class="emoji" title="Template Manager">🌱</span>
      <h1>Project Template Manager</h1>
    </div>
    <p class="subtitle">Export a project to a template, create a new project from a template, or create a new empty project.</p>
  </header>

  <main class="container">
    <!-- Export -->
    <section class="card">
      <div class="card-header">
        <h2>Export Template</h2>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <label for="projectSelect">Project</label>
          <div class="inline">
            <select id="projectSelect" class="input"></select>
            <button id="refreshProjectsBtn" class="btn secondary" title="Reload project list">Refresh</button>
          </div>

          <div class="spacer"></div>

          <button id="exportBtn" class="btn primary">Download Template</button>
        </div>
      </div>
    </section>

    <!-- Create New Project -->
    <section id="createCard" class="card">
        <div class="card-header">
            <h2>Create New Project</h2>
        </div>
        <div class="card-body">
            <div class="form-grid">
                <label for="createName">New Project Name</label>
                <input id="createName" class="input project-name" placeholder="e.g., My-New-Project" />

                <label for="createCode">Project Code (required, unique)</label>
                <input id="createCode" class="input project-code" placeholder="e.g., MY-PROJ (letters, numbers, dot, hyphen)" />

                <label for="createDesc">Description (optional)</label>
                <input id="createDesc" class="input project-desc" placeholder="Describe this project" />

                <div class="kv-header">
                    <span>Extra Fields (optional)</span>
                    <button id="addExtraBtnCreate" class="btn small secondary">Add field</button>
                </div>
                <div id="extraFieldsCreate" class="kv-list extra-fields"></div>

                <div class="actions">
                    <button id="createPreviewBtn" class="btn secondary">Preview (Dry Run)</button>
                    <button id="createProjectBtn" class="btn primary">Create Project</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Import -->
    <section id="importCard" class="card">
      <div class="card-header">
        <h2>Import Template</h2>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <label>Template JSON (choose a file or paste below)</label>
          <input type="file" id="templateFile" accept=".json,application/json" class="input" />
          <textarea id="templateText" class="input" rows="8" placeholder="{ ...template JSON... }"></textarea>

          <hr class="rule" />

          <label for="newName">New Project Name</label>
          <input id="newName" class="input project-name" placeholder="e.g., LIMS-Clone" />

          <label for="newCode">Project Code (required, unique)</label>
          <input id="newCode" class="input project-code" placeholder="e.g., LIMS-CLONE (letters, numbers, dot, hyphen)" />

          <label for="newDesc">Description (optional)</label>
          <input id="newDesc" class="input project-desc" placeholder="Describe this project" />

          <div class="kv-header">
            <span>Extra Fields (optional)</span>
            <button id="addExtraBtn" class="btn small secondary">Add field</button>
          </div>
          <div id="extraFields" class="kv-list extra-fields"></div>

          <div class="options">
            <label class="switch">
              <input type="checkbox" id="copyCustomChk" checked />
              <span>Copy <code>custom/</code> files</span>
            </label>
          </div>

          <div class="actions">
            <button id="previewBtn" class="btn secondary">Preview (Dry Run)</button>
            <button id="importBtn" class="btn primary">Create From Template</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Results Area -->
    <div id="results" class="results hidden card">
        <div class="results-header">
            <h3 id="resultsTitle">Plan</h3>
            <button id="clearResultsBtn" class="btn small">Clear</button>
        </div>
        <div id="resultsSummary" class="results-summary"></div>
        <div id="resultsTableWrap" class="table-wrap">
            <table id="resultsTable" class="table">
                <thead>
                    <tr>
                        <th>Op</th>
                        <th>Path</th>
                    </tr>
                </thead>
                <tbody id="resultsTbody"></tbody>
            </table>
        </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="/static/scripts/template.js" defer></script>
</body>
</html>
