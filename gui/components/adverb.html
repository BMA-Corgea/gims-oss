<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adverb Manager</title>
  <link rel="stylesheet" href="/static/styles/adverb.css">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
</head>
<body>

<div class="adverb-manager">
  <div class="section-header">
    <h2>Adverb Manager</h2>
    <div class="project-selector">
      <label for="project-select">Project:</label>
      <select id="project-select">
        <option value="">Select a project</option>
      </select>
    </div>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div class="verb-selector">
        <h3>Verbs</h3>
        <select id="verb-select" size="10">
          <option value="">Select a project first</option>
        </select>
      </div>
    </div>

    <div class="right-panel">
      <div class="adverb-list-container">
        <div class="panel-header">
          <h3>Adverbs</h3>
          <button id="add-adverb-btn" class="action-button" disabled>Add New</button>
        </div>
        <div class="adverb-list">
          <table id="adverb-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Required</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="adverb-list-body">
              <tr>
                <td colspan="4">Select a verb to view adverbs</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="adverb-form-container" class="hidden">
        <div class="panel-header">
          <h3 id="form-title">New Adverb</h3>
          <button id="close-form-btn" class="action-button">Close</button>
        </div>
        <form id="adverb-form">
          <input type="hidden" id="edit-mode" value="new">
          <input type="hidden" id="original-name" value="">
          
          <div class="form-group">
            <label for="adverb-name">Name:</label>
            <input type="text" id="adverb-name" required>
          </div>
          
          <div class="form-group">
            <label for="adverb-description">Description:</label>
            <textarea id="adverb-description" rows="2"></textarea>
          </div>
          
          <div class="form-group">
            <label for="adverb-class">Type:</label>
            <select id="adverb-class">
              <option value="Tag">Tag</option>
              <option value="Reference">Reference</option>
              <option value="ReferenceList">Reference List</option>
              <option value="Attribute">Attribute</option>
              <option value="Picture">Picture</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="adverb-required">Required:</label>
            <input type="checkbox" id="adverb-required">
          </div>
          
          <!-- Type-specific configuration sections -->
          <div id="tag-config" class="type-config hidden">
            <h4>Tag Options</h4>
            <div class="tag-options-container">
              <button type="button" id="add-tag-option-btn" class="secondary-button">Add Option</button>
              <div id="tag-options-list"></div>
            </div>
          </div>
          
          <div id="reference-config" class="type-config hidden">
            <h4>Reference Configuration</h4>
            <div class="form-group">
              <label for="reference-noun">Reference Noun:</label>
              <select id="reference-noun"></select>
            </div>
            <div class="filters-container">
              <h5>Filters</h5>
              <button type="button" id="add-filter-btn" class="secondary-button">Add Filter</button>
              <div id="filters-list"></div>
            </div>
          </div>
          
          <div id="reference-list-config" class="type-config hidden">
            <h4>Reference List Configuration</h4>
            <div class="form-group">
              <label>Reference Nouns:</label>
              <div id="reference-nouns-container"></div>
              <button type="button" id="add-noun-btn" class="secondary-button">Add Noun</button>
            </div>
          </div>
          
          <div id="attribute-config" class="type-config hidden">
            <h4>Attribute Configuration</h4>
            <div class="form-group">
              <label for="field-type">Field Type:</label>
              <select id="field-type">
                <option value="string">String</option>
                <option value="number">Number</option>
                <option value="date">Date</option>
              </select>
            </div>
            <div id="date-format-container" class="hidden">
              <label for="date-format">Date Format:</label>
              <select id="date-format">
                <option value="yyyy-mm-dd">yyyy-mm-dd</option>
                <option value="mmddyyyy">mmddyyyy</option>
                <option value="mmddyy">mmddyy</option>
              </select>
            </div>
          </div>
          
          <div class="form-actions">
            <button type="submit" id="save-adverb-btn" class="primary-button">Save</button>
            <button type="button" id="cancel-btn" class="secondary-button">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

  <script>
    // remove any leftover static loader
    document.querySelectorAll('script[src^="/static/scripts/adverb_editor.js"]').forEach(el => el.remove());
    // inject a cache-busted loader
    const s = document.createElement("script");
    s.src = `/static/scripts/adverb_editor.js?v=${Date.now()}`;
    document.body.appendChild(s);
  </script>
</body>
</html>
